{% extends 'core/base.html' %}
{% block title %}Eliminar desafío – KINC{% endblock %}
{% block page_title %}<i class="bi bi-trash me-2"></i>Eliminar desafío{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-5">
    <div class="kinc-form-card text-center">
      <div style="width:72px;height:72px;background:#FFEBEE;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem;">
        <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size:2rem;"></i>
      </div>
      <h5 class="fw-700 mb-2">¿Eliminar desafío?</h5>
      <p class="text-muted mb-4">Se eliminará el desafío <strong>{{ challenge.name }}</strong>.</p>
      <form method="post" class="d-flex gap-2 justify-content-center">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger rounded-pill px-4">Sí, eliminar</button>
        <a href="{% url 'challenge_list' %}" class="btn btn-outline-secondary rounded-pill px-4">Cancelar</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
